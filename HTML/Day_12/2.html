<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Euro using named (&euro;) and hexadecimal (&#x20AC;) -->
<p>The price of the item in Europe is &euro;50 (also written as &#x20AC;50).</p>

<!-- Pound using named (&pound;) and decimal (&#163;) -->
<p>The total cost in London is &pound;40 (or &#163;40).</p>

<!-- Yen using decimal entity (&#165;) -->
<p>The item is priced at &#165;5000 in Tokyo.</p>
</body>
</html>
