<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
  <tr>
    <th id="name" scope="col">Name</th>
    <th id="role" scope="col">Role</th>
    <th id="status" scope="col">Status</th>
  </tr>
  <tr>
    <th id="r1" scope="row">Alice</th>
    <td headers="r1 role">Developer</td>
    <td headers="r1 status">Active</td>
  </tr>
  <tr>
    <th id="r2" scope="row">Bob</th>
    <td headers="r2 role">Designer</td>
    <td headers="r2 status">Offline</td>
  </tr>
</table>
</body>
</html>
