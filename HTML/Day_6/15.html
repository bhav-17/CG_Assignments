<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
  <caption>Annual Department Performance</caption>
  <thead>
    <tr>
      <th id="dept" scope="col">Department</th>
      <th id="quarter" scope="col">Quarter</th>
      <th id="revenue" scope="col">Revenue</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th id="sales" scope="row" rowspan="2">Sales</th>
      <td headers="sales quarter">Q1</td>
      <td headers="sales revenue">$10,000</td>
    </tr>
    <tr>
      <td headers="sales quarter">Q2</td>
      <td headers="sales revenue">$15,000</td>
    </tr>
  </tbody>
  <tfoot>
    <tr>
      <td colspan="2">Total Sales Revenue</td>
      <td>$25,000</td>
    </tr>
  </tfoot>
</table>
</body>
</html>
