<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
  <title>Comprehensive List Example</title>
</head>
<body>

  <!-- Unordered list with specific bullet type & nested list -->
  <ul style="list-style-type: square;">
    <li>Category A
      <ol type="A">
        <li>Nested Topic 1</li>
        <li>Nested Topic 2</li>
      </ol>
    </li>
    <li>Category B</li>
  </ul>

  <!-- Ordered list with type, start, and reversed attributes -->
  <ol type="1" start="5" reversed>
    <li>Phase 5</li>
    <li>Phase 4</li>
    <li>Phase 3</li>
  </ol>

  <!-- Description list -->
  <dl>
    <dt>Term One</dt>
    <dd>Description for term one.</dd>
    <dt>Term Two</dt>
    <dd>Description for term two.</dd>
  </dl>

</body>
</html>
</body>
</html>
