<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(0, 0, 0);
            min-height: 0px;
        }

        .main {
            background-image: url(assets/images/IN-en-20260914-TRIFECTA-perspective_16ddf2ab-4945-4e79-8f84-6df3eef26875_large.jpg);
            background-position: center center;
            background-repeat: no-repeat;
            background-size: max(1200px, 100vw);
            height: 80vh;
            position: relative;
        }

        .main .box {
            height: 80vh;
            width: 100%;
            opacity: 0.7;
            background-color: black;
            position: absolute;
            top: 0;
            z-index: 1;
        }

        .flex {
            display: flex;
            align-items: center;
            max-width: 80vw;
            margin: auto;
            justify-content: space-around;
            position: relative;
            z-index: 2;
            top: 15px;
            gap: 200px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            position: relative;
            z-index: 3;
            margin-top: 150px;
            padding: 30px;
        }

        .hero span:first-child {
            font-size: 50px;
            font-weight: 700;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }

        .hero span:nth-child(2) {
            font-size: 50px;
            font-weight: 700;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }

        .hero span:nth-child(3) {
            font-size: 20px;
            font-weight: 500;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            margin-top: 20px;
        }

        .hero span:nth-child(4) {
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
        }

        #email {
            position: relative;
            z-index: 3;
            height: 39px;
            width: 400px;
            background-color: rgba(0, 0, 0, 0.384);
            border: none;
            padding-left: 20px;
            border-radius: 4px;
            border: 1px solid #c4c2c2;
            font-weight: 100;
            color: white;
            outline: none;
        }

        #email::placeholder {
            color: #c4c2c2;
            opacity: 1;
        }

        #button {
            position: relative;
            z-index: 3;
            height: 41px;
            width: 144px;
            font-size: 20px;
            background-color: rgb(209, 10, 10);
            border: none;
            border-radius: 3px;
            color: white;
            font-weight: 600;
            padding: 10px;
            cursor: pointer;
        }

        #button:hover {
            background-color: rgb(146, 8, 8);
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }

        .topbuttons {
            display: flex;
            gap: 10px
        }

        .lang {
            height: 26px;
            width: 81px;
            background-color: rgba(0, 0, 0, 0.26);
            border: none;
            color: white;
            border: 1px solid rgb(132, 131, 131);
            border-radius: 3px;
            padding: 2px 2px 2px 2px
        }

        .signin {
            height: 26px;
            width: 61px;
            background-color: rgb(209, 10, 10);
            border: none;
            border-radius: 3px;
            color: white;
            font-weight: 100;
            cursor: pointer;
        }

        .signin:hover {
            background-color: rgb(173, 9, 9);
        }

        .sep1 {
            height: 80px;
            background-color: rgb(0, 0, 0);
            border-top: 4px solid #e5096c;
            border-radius: 50% 50% 0 0;
            margin-top: -30px;
            position: relative;
            z-index: 5;
            box-shadow: 0px 0px 50px 20px black;
        }

        .trend {
            height: 40px;
            color: white;
            position: absolute;
            justify-content: start;
            align-items: center;
            display: flex;
            font-weight: bolder;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            top: 40px;
            left: 200px;
        }

        .shows {
            height: 400px;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
